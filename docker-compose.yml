services:  
  msclient:
    build: .\ms-client
    container_name: ms-client
    ports:
      - 8081:8081
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    networks:
      - amigoprogramador

  msdebitcard:
    build: .\ms-debitcard
    container_name: ms-debitcard
    ports:
      - 8082:8082
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    networks:
      - amigoprogramador
  
  mstransaction:
    build: .\ms-transaction
    container_name: ms-transaction
    ports:
      - 8083:8083
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    networks:
      - amigoprogramador

  apigateway:
    build: .\api-gateway
    container_name: api-gateway
    ports:
      - 9999:9999
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    networks:
      - amigoprogramador
  
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - 27017:27017  
    networks:
      - amigoprogramador
  
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    restart: always
    ports:
      - 2181:2181
    networks:
      - amigoprogramador
      
  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_HOST_NAME=kafka
      - KAFKA_ADVERTISED_PORT=9092
      - KAFKA_CREATE_TOPICS=TRANSFERENCE:1:1
      - KAFKA_BROKER_ID=1
    networks:
      - amigoprogramador 

  configserver:
    build: .\config-server
    container_name: config-server
    ports:
      - 8888:8888
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
        interval: 10s
        retries: 3
        start_period: 10s
    networks:
      - amigoprogramador

networks:
  amigoprogramador:
