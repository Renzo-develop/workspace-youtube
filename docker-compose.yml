services:  
  ms-client:
    build: .\ms-client
    image: amigoprogramador/msclient:latest
    container_name: "amigo-programador-msclient"
    ports:
      - 8081:8081
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
    networks:
      - amigo-programador

  ms-debitcard:
    build: .\ms-debitcard
    image: amigoprogramador/msdebitcard:latest
    container_name: "amigo-programador-msdebitcard"
    ports:
      - 8082:8082
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}    
    networks:
      - amigo-programador
  
  ms-transaction:
    build: .\ms-transaction
    image: amigoprogramador/mstransaction:latest
    container_name: "amigo-programador-mstransaction"
    ports:
      - 8083:8083
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}     
    networks:
      - amigo-programador

  api-gateway:
    build: .\api-gateway
    image: amigoprogramador/apigateway:latest
    container_name: "amigo-programador-apigateway"
    ports:
      - 9999:9999
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}    
    networks:
      - amigo-programador

  config-server:
    build: .\config-server
    image: amigoprogramador/configserver:latest
    container_name: "amigo-programador-configserver"
    ports:
      - 8888:8888
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
        interval: 10s
        retries: 3
        start_period: 10s
    networks:
      - amigo-programador      
  
  mongodb:
    image: mongo:latest
    container_name: amigo-programador-mongodb
    ports:
      - 27017:27017  
    networks:
      - amigo-programador
  
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    restart: always
    ports:
      - 2181:2181
    networks:
      - amigo-programador
      
  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_HOST_NAME=kafka
      - KAFKA_ADVERTISED_PORT=9092
      - KAFKA_CREATE_TOPICS=TRANSFERENCE:1:1
      - KAFKA_BROKER_ID=1
    networks:
      - amigo-programador
   
networks:
  amigo-programador:
